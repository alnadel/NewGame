<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>SHADY UI lab</title>
    <meta name="robots" content="noindex" />
    <!-- Dev-only page (served by `npx vite`, not part of the build): mounts every UI screen with fake data. -->
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #34306B; overscroll-behavior: none; }
      body { position: fixed; inset: 0; overflow: hidden; -webkit-tap-highlight-color: transparent;
             font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
              touch-action: none; user-select: none; -webkit-user-select: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #safe-probe { position: fixed; visibility: hidden; pointer-events: none;
                    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      #lab-bar { position: fixed; z-index: 100; right: 8px; bottom: 8px; max-width: min(92vw, 420px);
                 display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font: 600 12px/1.2 system-ui, sans-serif; }
      #lab-bar[hidden] { display: none; }
      #lab-bar .lab-toggle { padding: 6px 10px; border: 0; border-radius: 8px; background: #2B2140; color: #FFF8EE; font: inherit; cursor: pointer; }
      #lab-bar .lab-panel { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; padding: 8px; border-radius: 12px;
                            background: rgba(43, 33, 64, 0.88); box-shadow: 0 6px 18px rgba(0,0,0,.3); }
      #lab-bar .lab-panel[hidden] { display: none; }
      #lab-bar .lab-panel button { padding: 5px 8px; border: 0; border-radius: 6px; background: #FFF8EE; color: #2B2140; font: inherit; cursor: pointer; }
      #lab-bar .lab-panel button.is-on { background: #2EC4B6; }
      #lab-bar .lab-sep { flex-basis: 100%; height: 0; }
    </style>
  </head>
  <body>
    <canvas id="game" aria-hidden="true"></canvas>
    <div id="ui"></div>
    <div id="safe-probe" aria-hidden="true"></div>
    <div id="lab-bar"></div>
    <script type="module" src="./src/ui/lab.ts"></script>
  </body>
</html>
